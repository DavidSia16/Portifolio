<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Alcool  ou Gasolina ? 
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  
  <ion-grid>
    
    <ion-row>
      <ion-col size="12">
         <ion-img src="/assets/logo.png"></ion-img>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12">
         <h1>
           Saiba qual a melhor opcão para abaastecimento 
           do seu carro.
         </h1>
      </ion-col>
    </ion-row>

     <ion-row>
      <ion-col size="12">
         <ion-label position="stacked">
           Preço Àlcool, ex:1,90</ion-label>
         <ion-input type="number" [(ngModel)]="precoAlcool"></ion-input>
      </ion-col>
    </ion-row>

     <ion-row>
      <ion-col size="12">
         <ion-label position="stacked">
          Preço Gasolina ex:2,90</ion-label>
         <ion-input type="number" [(ngModel)]="precoGasolina"></ion-input>
      </ion-col>
    </ion-row>

    <ion-button expand="full" (click)="calcular()">Calcular</ion-button>

    <ion-row>
      <ion-col size="12">
        <h5 class="ion-text-center">{{resultado}}</h5>
      </ion-col>
    </ion-row>

  </ion-grid>

</ion-content>
